<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AsciiDoc Editor</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header id="menubar-row">
      <nav id="menubar" aria-label="メニュー"></nav>
    </header>
    <nav id="tabbar" aria-label="開いているドキュメント">
      <div id="tabbar-tabs"></div>
      <div id="tabbar-actions"></div>
    </nav>
    <main id="workspace">
      <aside id="sidebar" hidden>
        <div id="sidebar-header">
          <span id="vault-name" title="保管庫"></span>
          <button id="btn-vault-refresh" title="再読み込み">↻</button>
        </div>
        <div id="file-tree"></div>
      </aside>
      <section id="editor-pane"></section>
      <div id="divider" role="separator" aria-orientation="vertical"></div>
      <section id="preview-pane">
        <article id="preview" class="adoc"></article>
      </section>
    </main>
    <footer id="statusbar"></footer>
    <dialog id="settings-dialog"></dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
