<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AsciiDoc Editor</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header id="toolbar">
      <div class="toolbar-group toolbar-left">
        <span class="app-name">AsciiDoc Editor</span>
        <span id="filename" title="現在のファイル">Untitled</span>
        <span id="dirty-indicator" aria-hidden="true"></span>
      </div>
      <div class="toolbar-group toolbar-actions">
        <button id="btn-new" title="新規 (Ctrl+N)">新規</button>
        <button id="btn-open" title="開く (Ctrl+O)">開く</button>
        <button id="btn-save" title="保存 (Ctrl+S)">保存</button>
        <button id="btn-save-as" title="名前を付けて保存 (Ctrl+Shift+S)">名前を付けて保存</button>
        <span class="toolbar-sep" aria-hidden="true"></span>
        <button id="btn-export-html" title="HTML としてエクスポート">HTML 出力</button>
        <button id="btn-export-pdf" title="印刷 / PDF として保存 (Ctrl+P)">PDF / 印刷</button>
      </div>
      <span id="status" title="変換にかかった時間"></span>
    </header>
    <main id="workspace">
      <section id="editor-pane"></section>
      <div id="divider" role="separator" aria-orientation="vertical"></div>
      <section id="preview-pane">
        <article id="preview" class="adoc"></article>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
