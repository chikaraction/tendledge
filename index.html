<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AsciiDoc Editor</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header id="toolbar">
      <span class="app-name">AsciiDoc Editor</span>
      <span id="status" title="変換にかかった時間"></span>
    </header>
    <main id="workspace">
      <section id="editor-pane"></section>
      <div id="divider" role="separator" aria-orientation="vertical"></div>
      <section id="preview-pane">
        <article id="preview" class="adoc"></article>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
